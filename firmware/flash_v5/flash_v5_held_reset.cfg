# v5: add USART1 telemetry mirror (PA10 internal pull-up fix + debug trace) on top of v3.
# 3 pages. Calibration page 0x0800FC00 NEVER written. Held-reset; jumper pin3->pin5 first.
adapter speed 100
reset_config none
init
mww 0xE000EDFC 0x01000001
mww 0xE000EDF0 0xA05F0003
echo ""
echo "=== REMOVE the NRST->GND jumper NOW. Flashing in 15 s... ==="
echo ""
sleep 15000
halt
dump_image live_predump_v5.bin 0x08000000 0x10000
flash erase_address 0x08000000 0x400
flash write_image flash_v5/page00_vectors.bin 0x08000000
verify_image flash_v5/page00_vectors.bin 0x08000000
flash erase_address 0x08005800 0x400
flash write_image flash_v5/page22_u1_loophook.bin 0x08005800
verify_image flash_v5/page22_u1_loophook.bin 0x08005800
flash erase_address 0x0800A000 0x400
flash write_image flash_v5/page40_u1_driver.bin 0x0800A000
verify_image flash_v5/page40_u1_driver.bin 0x0800A000
mww 0xE000EDFC 0x01000000
mww 0xE000ED0C 0x05FA0004
echo "=== v5 FLASHED (USART1 mirror + pull-up fix + debug trace) ==="
shutdown
