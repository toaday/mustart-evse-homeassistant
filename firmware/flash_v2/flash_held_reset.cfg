# Mustart EVSE patch v2 flash via HELD-RESET (clone ST-Link can't drive NRST).
# Procedure: jumper header pin 3 (NRST) -> pin 5 (GND) BEFORE starting.
# This arms halt-on-reset (DEMCR VC_CORERESET), waits for you to remove the
# jumper, then catches the core at the reset vector before firmware kills SWD.
# Config/calibration page 0x0800FC00 is NEVER written.
adapter speed 100
reset_config none
init
# arm vector catch + request halt while the core is held in reset
mww 0xE000EDFC 0x01000001
mww 0xE000EDF0 0xA05F0003
echo ""
echo "======================================================================"
echo "   REMOVE the NRST->GND jumper (header pin 3 <-> pin 5) NOW."
echo "   Flashing begins automatically in 15 seconds..."
echo "======================================================================"
echo ""
sleep 15000
halt
# ---- live backup FIRST ----
dump_image live_predump.bin 0x08000000 0x10000
# ---- 5 pages; config page NOT in the set ----
flash erase_address 0x08000000 0x400
flash write_image flash_v2/page00_vectors.bin 0x08000000
verify_image flash_v2/page00_vectors.bin 0x08000000
flash erase_address 0x08003800 0x400
flash write_image flash_v2/page14_isrfix.bin 0x08003800
verify_image flash_v2/page14_isrfix.bin 0x08003800
flash erase_address 0x08003c00 0x400
flash write_image flash_v2/page15_lenclamp.bin 0x08003c00
verify_image flash_v2/page15_lenclamp.bin 0x08003c00
flash erase_address 0x08004c00 0x400
flash write_image flash_v2/page19_mainhooks.bin 0x08004c00
verify_image flash_v2/page19_mainhooks.bin 0x08004c00
flash erase_address 0x08009000 0x400
flash write_image flash_v2/page36_veneers.bin 0x08009000
verify_image flash_v2/page36_veneers.bin 0x08009000
# ---- clear vector catch, software-reset into the new firmware ----
mww 0xE000EDFC 0x01000000
mww 0xE000ED0C 0x05FA0004
echo "=== FLASH COMPLETE - new firmware running ==="
shutdown
