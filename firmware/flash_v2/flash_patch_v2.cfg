# Mustart EVSE MCU patch v2 flash (ST-Link, connect-under-reset). Config page 0x0800FC00 NOT touched.
init
reset halt
dump_image live_predump.bin 0x08000000 0x10000
flash erase_address 0x08000000 0x400
flash write_image flash_v2/page00_vectors.bin 0x08000000
verify_image flash_v2/page00_vectors.bin 0x08000000
flash erase_address 0x08003800 0x400
flash write_image flash_v2/page14_isrfix.bin 0x08003800
verify_image flash_v2/page14_isrfix.bin 0x08003800
flash erase_address 0x08003c00 0x400
flash write_image flash_v2/page15_lenclamp.bin 0x08003c00
verify_image flash_v2/page15_lenclamp.bin 0x08003c00
flash erase_address 0x08004c00 0x400
flash write_image flash_v2/page19_mainhooks.bin 0x08004c00
verify_image flash_v2/page19_mainhooks.bin 0x08004c00
flash erase_address 0x08009000 0x400
flash write_image flash_v2/page36_veneers.bin 0x08009000
verify_image flash_v2/page36_veneers.bin 0x08009000
reset run
shutdown
