# v11: USART1 telemetry mirror, NO high RAM (reuses idle USART2 TX buffer), SWD kept alive. On top of v3.
# Fixes v5-v10 reboots: their RX/TX buffers at 0x20001C00-0x20001F14 landed in LIVE firmware RAM.
# v11 uses no RAM at/above 0x20001000, a byte-matcher (no RX buffer), and restores PA14=SWCLK.
# Calibration / config page 0x0800FC00 is NEVER touched. Held-reset; jumper pin3->pin5 first, pull at prompt.
adapter speed 100
reset_config none
init
mww 0xE000EDFC 0x01000001
mww 0xE000EDF0 0xA05F0003
echo ""
echo "=== REMOVE the NRST->GND jumper NOW. Flashing in 15 s... ==="
echo ""
sleep 15000
halt
dump_image live_predump_v11.bin 0x08000000 0x10000
flash erase_address 0x08000000 0x400
flash write_image flash_v11/page00_vectors.bin 0x08000000
verify_image flash_v11/page00_vectors.bin 0x08000000
flash erase_address 0x08005800 0x400
flash write_image flash_v11/page22_u1_loophook.bin 0x08005800
verify_image flash_v11/page22_u1_loophook.bin 0x08005800
flash erase_address 0x0800A000 0x400
flash write_image flash_v11/page40_u1_driver.bin 0x0800A000
verify_image flash_v11/page40_u1_driver.bin 0x0800A000
mww 0xE000EDFC 0x01000000
mww 0xE000ED0C 0x05FA0004
echo "=== v11 FLASHED (no high RAM, byte-matcher, SWD alive) ==="
shutdown
