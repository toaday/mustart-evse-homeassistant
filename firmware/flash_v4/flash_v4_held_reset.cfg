# Mustart EVSE v4 = v2 crash-protection + 12A boot default + USART1 telemetry mirror.
# ONE flash of all 9 changed pages. Calibration page 0x0800FC00 is NEVER written.
# Held-reset method (clone ST-Link): jumper header pin 3 (NRST) -> pin 5 (GND) BEFORE start.
adapter speed 100
reset_config none
init
mww 0xE000EDFC 0x01000001
mww 0xE000EDF0 0xA05F0003
echo ""
echo "=== REMOVE the NRST->GND jumper NOW. Flashing in 15 s... ==="
echo ""
sleep 15000
halt
# FULL BACKUP FIRST
dump_image live_predump_v4.bin 0x08000000 0x10000
flash erase_address 0x08000000 0x400
flash write_image flash_v4/page00_vectors.bin 0x08000000
verify_image flash_v4/page00_vectors.bin 0x08000000
flash erase_address 0x08001800 0x400
flash write_image flash_v4/page06_amps_hook.bin 0x08001800
verify_image flash_v4/page06_amps_hook.bin 0x08001800
flash erase_address 0x08003800 0x400
flash write_image flash_v4/page14_isrfix.bin 0x08003800
verify_image flash_v4/page14_isrfix.bin 0x08003800
flash erase_address 0x08003C00 0x400
flash write_image flash_v4/page15_lenclamp.bin 0x08003C00
verify_image flash_v4/page15_lenclamp.bin 0x08003C00
flash erase_address 0x08004C00 0x400
flash write_image flash_v4/page19_mainhooks.bin 0x08004C00
verify_image flash_v4/page19_mainhooks.bin 0x08004C00
flash erase_address 0x08005800 0x400
flash write_image flash_v4/page22_u1_loophook.bin 0x08005800
verify_image flash_v4/page22_u1_loophook.bin 0x08005800
flash erase_address 0x08009000 0x400
flash write_image flash_v4/page36_v2veneers.bin 0x08009000
verify_image flash_v4/page36_v2veneers.bin 0x08009000
flash erase_address 0x08009400 0x400
flash write_image flash_v4/page37_amps_veneer.bin 0x08009400
verify_image flash_v4/page37_amps_veneer.bin 0x08009400
flash erase_address 0x0800A000 0x400
flash write_image flash_v4/page40_u1_driver.bin 0x0800A000
verify_image flash_v4/page40_u1_driver.bin 0x0800A000
mww 0xE000EDFC 0x01000000
mww 0xE000ED0C 0x05FA0004
echo "=== v4 FLASHED (crash-protection + 12A + USART1) - running ==="
shutdown
