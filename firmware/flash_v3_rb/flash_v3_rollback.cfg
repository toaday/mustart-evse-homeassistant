# ROLL BACK v4 -> v3: removes the USART1 driver (bootloop cause), keeps v2 crash-protection
# + 12A amps default. Calibration page 0x0800FC00 NEVER written. Held-reset method.
# Jumper header pin 3 (NRST) -> pin 5 (GND) BEFORE start; pull at the prompt.
adapter speed 100
reset_config none
init
mww 0xE000EDFC 0x01000001
mww 0xE000EDF0 0xA05F0003
echo ""
echo "=== REMOVE the NRST->GND jumper NOW. Flashing in 15 s... ==="
echo ""
sleep 15000
halt
dump_image live_predump_rb.bin 0x08000000 0x10000
flash erase_address 0x08000000 0x400
flash write_image flash_v3_rb/page00_vectors.bin 0x08000000
verify_image flash_v3_rb/page00_vectors.bin 0x08000000
flash erase_address 0x08001800 0x400
flash write_image flash_v3_rb/page06_amps_hook.bin 0x08001800
verify_image flash_v3_rb/page06_amps_hook.bin 0x08001800
flash erase_address 0x08003800 0x400
flash write_image flash_v3_rb/page14_isrfix.bin 0x08003800
verify_image flash_v3_rb/page14_isrfix.bin 0x08003800
flash erase_address 0x08003C00 0x400
flash write_image flash_v3_rb/page15_lenclamp.bin 0x08003C00
verify_image flash_v3_rb/page15_lenclamp.bin 0x08003C00
flash erase_address 0x08004C00 0x400
flash write_image flash_v3_rb/page19_mainhooks.bin 0x08004C00
verify_image flash_v3_rb/page19_mainhooks.bin 0x08004C00
flash erase_address 0x08005800 0x400
flash write_image flash_v3_rb/page22_revert.bin 0x08005800
verify_image flash_v3_rb/page22_revert.bin 0x08005800
flash erase_address 0x08009000 0x400
flash write_image flash_v3_rb/page36_v2veneers.bin 0x08009000
verify_image flash_v3_rb/page36_v2veneers.bin 0x08009000
flash erase_address 0x08009400 0x400
flash write_image flash_v3_rb/page37_amps_veneer.bin 0x08009400
verify_image flash_v3_rb/page37_amps_veneer.bin 0x08009400
flash erase_address 0x0800A000 0x400
flash write_image flash_v3_rb/page40_blank.bin 0x0800A000
verify_image flash_v3_rb/page40_blank.bin 0x0800A000
mww 0xE000EDFC 0x01000000
mww 0xE000ED0C 0x05FA0004
echo "=== ROLLED BACK to v3 (crash-protection + 12A, NO USART1) ==="
shutdown
