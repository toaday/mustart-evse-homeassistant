# v6: USART1 telemetry mirror with POLLED RX (no interrupt -> cannot storm). On top of v3.
# Reverts the v5 USART1 vector, installs the polled driver. Calibration NEVER written.
# Held-reset; jumper pin3->pin5 first, pull at prompt.
adapter speed 100
reset_config none
init
mww 0xE000EDFC 0x01000001
mww 0xE000EDF0 0xA05F0003
echo ""
echo "=== REMOVE the NRST->GND jumper NOW. Flashing in 15 s... ==="
echo ""
sleep 15000
halt
dump_image live_predump_v10.bin 0x08000000 0x10000
flash erase_address 0x08000000 0x400
flash write_image flash_v10/page00_vectors.bin 0x08000000
verify_image flash_v10/page00_vectors.bin 0x08000000
flash erase_address 0x08005800 0x400
flash write_image flash_v10/page22_u1_loophook.bin 0x08005800
verify_image flash_v10/page22_u1_loophook.bin 0x08005800
flash erase_address 0x0800A000 0x400
flash write_image flash_v10/page40_u1_driver.bin 0x0800A000
verify_image flash_v10/page40_u1_driver.bin 0x0800A000
mww 0xE000EDFC 0x01000000
mww 0xE000ED0C 0x05FA0004
echo "=== v10 FLASHED (polled, buffers relocated) (USART1 polled RX, storm-proof) ==="
shutdown
