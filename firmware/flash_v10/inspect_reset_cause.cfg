# READ-ONLY: held-reset halt, read v2 reset bookkeeping via read_memory. Jumper pin3->pin5 first.
adapter speed 100
reset_config none
init
mww 0xE000EDFC 0x01000001
mww 0xE000EDF0 0xA05F0003
echo ""
echo "=== REMOVE the NRST-GND jumper NOW. Reading in 15 s... ==="
echo ""
sleep 15000
halt
set a [read_memory 0x20001F00 32 5]
echo "RESETLOG magic total last_csr iwdg_cnt fault_cnt ="
echo $a
resume
shutdown
