# Attach to the RUNNING v11 firmware over SWD (PA14 is restored to SWCLK by u1_init, so the
# debug port stays alive). No reset, no NRST jumper needed. Just: ST-Link on the header,
# board already booted v11, then run this. Reads the live USART1 state.
adapter speed 100
reset_config none
init
halt
set cr1 [read_memory 0x40013800 32 1]
echo "USART1 CR1 (want 0x0000000d = UE|RE|TE):"
echo $cr1
set ans [read_memory 0x20000298 32 1]
echo "ANSWERS (polls answered so far; run twice, should climb if telemetry works):"
echo $ans
set mc [read_memory 0x20000290 32 1]
echo "MATCHCNT (current poll-match position 0..11):"
echo $mc
resume
shutdown
