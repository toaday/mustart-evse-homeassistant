# Mustart EVSE: ADD the 12A-boot-default patch ON TOP of the already-flashed v2.
# Writes only 2 pages: 0x08001800 (hook) and 0x08009400 (veneer). v2's pages and the
# calibration page 0x0800FC00 are NOT touched. Held-reset method (clone ST-Link).
# Jumper header pin 3 (NRST) -> pin 5 (GND) BEFORE starting; pull it at the prompt.
adapter speed 100
reset_config none
init
mww 0xE000EDFC 0x01000001
mww 0xE000EDF0 0xA05F0003
echo ""
echo "=== REMOVE the NRST->GND jumper NOW. Flashing in 15 s... ==="
echo ""
sleep 15000
halt
dump_image live_predump_v3.bin 0x08000000 0x10000
# hook page (full 1KB)
flash erase_address 0x08001800 0x400
flash write_image flash_v3/page_hook_0x08001800.bin 0x08001800
verify_image flash_v3/page_hook_0x08001800.bin 0x08001800
# veneer page (erase 1KB, write 28 bytes)
flash erase_address 0x08009400 0x400
flash write_image flash_v3/veneer_0x08009400.bin 0x08009400
verify_image flash_v3/veneer_0x08009400.bin 0x08009400
mww 0xE000EDFC 0x01000000
mww 0xE000ED0C 0x05FA0004
echo "=== AMPS PATCH FLASHED - new firmware running ==="
shutdown
