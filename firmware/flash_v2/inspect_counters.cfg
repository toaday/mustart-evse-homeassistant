# READ-ONLY: held-reset halt, then read the reset-bookkeeping block. No flash, no device writes.
# Jumper header pin 3 (NRST) -> pin 5 (GND) BEFORE starting.
adapter speed 100
reset_config none
init
mww 0xE000EDFC 0x01000001
mww 0xE000EDF0 0xA05F0003
echo ""
echo "=== REMOVE the NRST->GND jumper NOW. Reading in 15 seconds... ==="
echo ""
sleep 15000
halt
echo ""
echo "--- reset bookkeeping @0x20001F00  [magic | total | last_csr | iwdg_cnt | fault_cnt] ---"
mdw 0x20001F00 5
echo "--- expect on first post-flash boot:  b007c0de  00000000  1xxxxxxx(SFT)  00000000  00000000 ---"
echo ""
resume
shutdown
