# Mustart EVSE: read-only telemetry over the charger's USART2 port (7-pin header).
#
# Wiring (USART1 / factory traces — NO jumper wires):
#   ESP-12F GPIO1 (TXD0) -> MCU PA10 (USART1_RX, pin 31)   via the board's M1 trace
#   ESP-12F GPIO3 (RXD0) <- MCU PA9  (USART1_TX, pin 30)   via the board's M1 trace
#   GND shared. 9600 8N1, 3.3 V. Requires MCU firmware v4 (USART1 service). Remove the
#   old GPIO5/GPIO4 bit-bang jumpers before using this. Logger stays off UART (baud_rate 0).
#
# SAFETY: this config transmits ONE fixed frame only: command 0x01 (read live values).
#   EB 0A 00 01 00 0B 00 01 17 00 90
# Never add other commands. 0x00 factory-resets calibration in flash, 0x03 starts/stops
# charging, and 0x07/02 and 0x55 write config. See firmware/FINDINGS.md §5.
#
# Reply slots (cmd 0x01), verified against the charger's own display on 2026-11-23:
#   slot 4 = current, 0.1 A      (161 -> 16.1 A, display 16.1 A)
#   slot 5 = mains voltage, 0.1 V (2427 -> 242.7 V, display 242 V)
#   slot 2 = control pilot, 0.1 V (117 no car / 87 connected / 58 charging)
#   slot 1 = temperature, 0.1 C   (tentative: rose 23.7 -> 29.9 C while charging)
#   slots 3, 10, 11 = unknown (0 or ~0), kept as diagnostics

substitutions:
  device_name: mustart-evse
  device_description: Mustart EVSE (read-only telemetry)
  friendly_name: Mustart EVSE
  id: mustart_evse

esphome:
  name: ${device_name}
  comment: ${device_description}

esp8266:
  board: esp12e

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${friendly_name}
    password: !secret fallback_password

captive_portal:

# Logging over UART disabled: GPIO1/3 are tied to the MCU's unused USART1 pins
logger:
  baud_rate: 0

# Enable Home Assistant API
api:

ota:
  platform: esphome
  password: !secret ota_password

# Enable Web server.
web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_server_password

uart:
  id: evse_uart
  tx_pin: GPIO1          # hardware UART0 TX -> MCU pin 31 (PA10 = USART1_RX), via factory trace
  rx_pin: GPIO3          # hardware UART0 RX <- MCU pin 30 (PA9 = USART1_TX), via factory trace
  baud_rate: 9600
  rx_buffer_size: 256
  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 60ms          # a 33-byte reply takes ~35 ms at 9600; flush after the line goes quiet
    sequence:
      - lambda: |-
          id(rx_bytes) += bytes.size();
          ESP_LOGD("evse", "RX %u byte(s), first=0x%02X", bytes.size(), bytes.empty() ? 0 : bytes[0]);
          // Append to a rolling buffer and pull out complete frames (EB ... 90)
          static std::vector<uint8_t> buf;
          buf.insert(buf.end(), bytes.begin(), bytes.end());
          if (buf.size() > 512) buf.erase(buf.begin(), buf.end() - 256);
          while (true) {
            auto s = std::find(buf.begin(), buf.end(), (uint8_t) 0xEB);
            if (s == buf.end()) { buf.clear(); return; }
            buf.erase(buf.begin(), s);
            auto e = std::find(buf.begin() + 1, buf.end(), (uint8_t) 0x90);
            if (e == buf.end()) return;                       // wait for the rest
            std::vector<uint8_t> raw(buf.begin(), e + 1);
            buf.erase(buf.begin(), e + 1);
            // Un-escape: 27 15 -> EB, 27 70 -> 90, 27 D9 -> 27
            std::vector<uint8_t> f;
            for (size_t i = 0; i < raw.size(); i++) {
              if (raw[i] == 0x27 && i + 1 < raw.size()) {
                uint8_t n = raw[++i];
                f.push_back(n == 0x15 ? 0xEB : n == 0x70 ? 0x90 : n == 0xD9 ? 0x27 : n);
              } else {
                f.push_back(raw[i]);
              }
            }
            if (f.size() != 33) { id(bad_frames) += 1; continue; }
            uint16_t n = f[5] | (f[6] << 8);
            if (n != 33 || f[7] != 0x01) { id(bad_frames) += 1; continue; }
            uint16_t sum = 0;
            for (int i = 1; i < n - 3; i++) sum += f[i];
            if ((sum & 0xFF) != f[n - 3] || (sum >> 8) != f[n - 2]) { id(bad_frames) += 1; continue; }
            auto u16 = [&](int k) -> float { return (float) (f[8 + 2 * k] | (f[9 + 2 * k] << 8)); };
            // Reply order: idx 2, 1, 10, 3, 5, 4, 11, 11, 11
            float pilot = u16(0) / 10.0f;
            float temp  = u16(1) / 10.0f;
            float amps  = u16(5) / 10.0f;
            float volts = u16(4) / 10.0f;
            id(pilot_v).publish_state(pilot);
            id(temperature).publish_state(temp);
            id(current).publish_state(amps);
            id(voltage).publish_state(volts);
            id(power).publish_state(volts * amps / 1000.0f);
            id(slot10).publish_state(u16(2));
            id(slot3).publish_state(u16(3));
            id(slot11).publish_state(u16(6));
            const char *st = pilot > 10.5f ? "Not connected"
                           : pilot > 7.5f  ? "Connected"
                           : pilot > 4.5f  ? "Charging"
                           : pilot > 1.5f  ? "Charging (ventilation)"
                           : "Error / no pilot";
            if (id(evse_state).state != st) id(evse_state).publish_state(st);
            id(good_frames) += 1;
            id(last_ok) = millis();
          }

globals:
  - id: bad_frames
    type: int
    initial_value: '0'
  - id: good_frames
    type: int
    initial_value: '0'
  - id: rx_bytes
    type: int
    initial_value: '0'
  - id: last_ok
    type: uint32_t
    initial_value: '0'
  - id: tx_count
    type: int
    initial_value: '0'

# DIAGNOSTIC build: poll fast with no startup delay, count every poll we send, and log TX/RX
# into the web log panel so we can see whether the ESP is transmitting and whether anything
# comes back. Revert to the 60 s-delay/10 s version once the link is understood.
interval:
  - interval: 3s
    then:
      - lambda: |-
          id(tx_count) += 1;
          ESP_LOGD("evse", "poll TX #%d (cmd-01, 11 bytes out GPIO5)", id(tx_count));
      - uart.write:
          id: evse_uart
          data: [0xEB, 0x0A, 0x00, 0x01, 0x00, 0x0B, 0x00, 0x01, 0x17, 0x00, 0x90]

button:
  - platform: restart
    name: ${friendly_name} Restart

# Text sensors with general information.
text_sensor:
  # Expose ESPHome version as sensor.
  - platform: version
    name: ${friendly_name} ESPHome Version
  # Expose WiFi information as sensors.
  - platform: wifi_info
    ip_address:
      name: ${friendly_name} IP
      id: IP
    ssid:
      name: ${friendly_name} SSID
    bssid:
      name: ${friendly_name} BSSID
  - platform: template
    id: evse_state
    name: ${friendly_name} State
    icon: mdi:ev-station

# Sensors with general information.
sensor:
  # Uptime sensor.
  - platform: uptime
    name: ${friendly_name} Uptime

  # WiFi Signal sensor.
  - platform: wifi_signal
    name: ${friendly_name} WiFi Signal
    update_interval: 60s

  # Charger measurements
  - platform: template
    id: voltage
    name: ${friendly_name} Voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: current
    name: ${friendly_name} Current
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: power
    name: ${friendly_name} Power
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
  - platform: integration
    id: energy_total
    name: ${friendly_name} Energy
    sensor: power
    time_unit: h
    integration_method: left
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
  - platform: template
    id: pilot_v
    name: ${friendly_name} Pilot Voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: template
    id: temperature
    name: ${friendly_name} Temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  # Unidentified slots (diagnostic)
  - platform: template
    id: slot3
    name: ${friendly_name} Raw Slot 3
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: slot10
    name: ${friendly_name} Raw Slot 10
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: slot11
    name: ${friendly_name} Raw Slot 11
    accuracy_decimals: 0
    entity_category: diagnostic

  # Link diagnostics
  - platform: template
    name: ${friendly_name} Good Frames
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return id(good_frames);'
  - platform: template
    name: ${friendly_name} Bad Frames
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: 'return id(bad_frames);'
  - platform: template
    name: ${friendly_name} RX Bytes
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    lambda: 'return id(rx_bytes);'
  - platform: template
    name: ${friendly_name} TX Count
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    lambda: 'return id(tx_count);'

binary_sensor:
  - platform: template
    name: ${friendly_name} Link OK
    entity_category: diagnostic
    lambda: 'return id(last_ok) != 0 && (millis() - id(last_ok)) < 30000;'
